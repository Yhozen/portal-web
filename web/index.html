<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Web</title><link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px monospace;color:#cfe}#c{width:100%;height:100%;display:block}
#hud{position:fixed;left:6px;top:4px;text-shadow:0 0 2px #000}#log{position:fixed;left:6px;bottom:4px;white-space:pre;opacity:.8;max-height:30%;overflow:hidden;text-shadow:0 0 2px #000}

#hint{position:fixed;left:0;right:0;top:62%;text-align:center;font:16px sans-serif;color:#fff;text-shadow:0 0 3px #000}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}#help{position:fixed;right:6px;top:4px;text-align:right;opacity:.7}
